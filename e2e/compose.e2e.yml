# Overrides the server's demo stack (sarcade-server/demo/docker-compose.demo.yml)
# for the end-to-end tests: the server serves the web client built from this
# branch, mounted below; the image embeds none (SARCADE_WEB=none, nothing
# downloaded; card « GitHub de nouveau actif (10 novembre 2026) »: no more
# web-dev pre-release).
services:
  server:
    build:
      args:
        SARCADE_WEB: none
    environment:
      SARCADE_WEB_ROOT: /e2e-web
    volumes:
      - ${SARCADE_E2E_WEB:?path of the web build}:/e2e-web:ro
